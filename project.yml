name: MetaTrader5Terminal
options:
  bundleIdPrefix: net.metaquotes
  deploymentTarget:
    iOS: "16.0"
  createSharedSchemes: true
  xcodeVersion: "16.0"
targets:
  MetaTrader5Terminal:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ios_native_project
        excludes:
          - "Info.plist"
      - path: css
      - path: js
      - path: sounds
      - path: assets
      - path: index.html
    info:
      path: ios_native_project/Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: net.metaquotes.MetaTrader5Terminal
      PRODUCT_NAME: "MetaTrader 5"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: YES
      AD_HOC_CODE_SIGNING_ALLOWED: YES
