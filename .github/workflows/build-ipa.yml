name: Build MetaTrader 5 iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Latest Xcode
        run: |
          for xc in /Applications/Xcode_16*.app /Applications/Xcode_15*.app; do
            if [ -d "$xc" ]; then
              sudo xcode-select -s "$xc/Contents/Developer"
              break
            fi
          done
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build App with Xcode
        run: |
          set +e
          xcodebuild clean build \
            -project MetaTrader5Terminal.xcodeproj \
            -scheme MetaTrader5Terminal \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            AD_HOC_CODE_SIGNING_ALLOWED=YES > build.log 2>&1
          BUILD_STATUS=$?
          echo "=== XCODEBUILD EXIT CODE: $BUILD_STATUS ==="

          if [ $BUILD_STATUS -ne 0 ]; then
            cat build.log | tail -n 50
            exit 1
          fi

      - name: Package Payload to IPA
        run: |
          APP_PATH=$(find ./DerivedData -name "MetaTrader5Terminal.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r MetaTrader5_LocalDemo.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MetaTrader5-LocalDemo-IPA
          path: MetaTrader5_LocalDemo.ipa
